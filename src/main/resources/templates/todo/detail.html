<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ToDo 詳細</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link th:replace="~{fragments/quest-theme :: stylesheet}" rel="stylesheet">
</head>
<body class="quest-theme" data-bs-theme="dark">
<main class="container py-5">
    <nav class="d-flex flex-wrap gap-2 mb-4" aria-label="戻る">
        <a class="btn btn-outline-primary quest-button" th:href="@{/todo/dashboard}">作戦司令室に戻る</a>
        <a class="btn btn-outline-secondary quest-button" th:href="@{/todo}">ToDo一覧に戻る</a>
    </nav>
    <article class="card shadow-sm quest-window" aria-labelledby="task-title">
        <div class="card-body p-3 p-sm-4">
            <h1 id="task-title" class="h3 mb-4 text-break quest-heading quest-title" style="white-space: pre-wrap" th:text="${todo.title}">タスク名</h1>
            <dl class="row mb-0">
                <dt class="col-sm-3 quest-note">状態</dt>
                <dd class="col-sm-9" th:text="${todo.status.label}">未着手</dd>
                <dt class="col-sm-3 quest-note">カテゴリ</dt>
                <dd class="col-sm-9 text-break" th:text="${todo.categoryName ?: '未設定'}">未設定</dd>
                <dt class="col-sm-3 quest-note">担当者</dt>
                <dd class="col-sm-9 text-break" th:text="${todo.assigneeName ?: '未設定'}">未設定</dd>
                <dt class="col-sm-3 quest-note">開始日</dt>
                <dd class="col-sm-9" th:text="${todo.startDate ?: '未設定'}">未設定</dd>
                <dt class="col-sm-3 quest-note">期限</dt>
                <dd class="col-sm-9" th:text="${todo.dueDate ?: '未設定'}">未設定</dd>
                <dt class="col-sm-3 quest-note">親タスク</dt>
                <dd class="col-sm-9 mb-0 text-break">
                    <span th:if="${todo.parentId == null}">なし</span>
                    <a class="quest-link" th:if="${todo.parentId != null}" th:href="@{/todo/{id}(id=${todo.parentId})}"
                       th:text="${todo.parentTitle}">親タスク名</a>
                </dd>
            </dl>
        </div>
    </article>
</main>
</body>
</html>
