<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録内容の確認</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <h1 class="h3 mb-4">登録内容の確認</h1>

            <div class="card shadow-sm mb-4">
                <div class="card-body p-4">
                    <label for="display-title" class="form-label">タイトル</label>
                    <input id="display-title" type="text" class="form-control-plaintext"
                           th:value="${title}" value="サンプルタスク" readonly>
                    <p class="mb-0" th:if="${category != null}">
                        カテゴリ: <span th:text="${category.name}">事前準備</span>
                    </p>
                    <p class="mb-0" th:if="${assignee != null}">
                        担当者: <span th:text="${assignee.name}">たろう</span>
                    </p>
                    <dl class="mt-3 mb-0">
                        <dt>親タスク</dt>
                        <dd th:text="${parent == null ? '親なし（大作業・独立タスク）' : parent.title}">親なし</dd>
                        <dt>開始日</dt>
                        <dd th:text="${#strings.isEmpty(startDate) ? '未設定' : startDate}">未設定</dd>
                        <dt>期限</dt>
                        <dd th:text="${#strings.isEmpty(dueDate) ? '未設定' : dueDate}">未設定</dd>
                        <dt th:if="${confirmedStatus != null}">状態</dt>
                        <dd th:if="${confirmedStatus != null}" class="mb-0" th:text="${confirmedStatus.label}">未着手</dd>
                    </dl>
                </div>
            </div>

            <form th:action="@{/todo/complete}" method="post" class="d-flex gap-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="title" th:value="${title}">
                <input type="hidden" name="categoryId" th:value="${categoryId}">
                <input type="hidden" name="assigneeId" th:value="${assigneeId}">
                <input type="hidden" name="parentId" th:value="${parentId}">
                <input type="hidden" name="startDate" th:value="${startDate}">
                <input type="hidden" name="dueDate" th:value="${dueDate}">
                <input type="hidden" name="description" th:value="${description}">
                <input type="hidden" name="status" th:value="${status}">
                <button type="button" class="btn btn-outline-secondary" onclick="history.back()">戻る</button>
                <button type="submit" class="btn btn-primary">登録</button>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
