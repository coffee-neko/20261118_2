<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo 新規登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link th:replace="~{fragments/quest-theme :: stylesheet}" rel="stylesheet">
</head>
<body class="quest-theme quest-registration" data-bs-theme="dark">
<main class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm quest-window">
                <div class="card-body p-3 p-sm-4">
                    <h1 class="h3 mb-4 quest-heading quest-title">ToDo 新規登録</h1>

                    <div th:if="${errorMessage}" th:text="${errorMessage}" class="alert alert-danger" role="alert"></div>

                    <form th:action="@{/todo/confirm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label for="title" class="form-label">タイトル</label>
                            <input id="title" name="title" type="text" class="form-control" th:value="${title}" required>
                        </div>

                        <div class="mb-3">
                            <label for="parentId" class="form-label">親タスク</label>
                            <select id="parentId" name="parentId" class="form-select">
                                <option value="">親なし（大作業・独立タスク）</option>
                                <option th:each="option : ${parentOptions}" th:value="${option.id}"
                                        th:selected="${option.id.toString() == parentId}"
                                        th:text="|#${option.id} ${option.title}|">大作業</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="categoryId" class="form-label">カテゴリ</label>
                            <select id="categoryId" name="categoryId" class="form-select">
                                <option value="">未設定</option>
                                <option th:each="category : ${categories}" th:value="${category.id}"
                                        th:selected="${category.id == categoryId}"
                                        th:text="${category.name}">事前準備</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="assigneeId" class="form-label">担当者</label>
                            <select id="assigneeId" name="assigneeId" class="form-select">
                                <option value="">未設定</option>
                                <option th:each="assignee : ${assignees}" th:value="${assignee.id}"
                                        th:selected="${assignee.id == assigneeId}"
                                        th:text="${assignee.name}">たろう</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="startDate" class="form-label">開始日（任意）</label>
                            <input id="startDate" name="startDate" type="date" class="form-control"
                                   max="9999-12-31" th:value="${startDate}">
                        </div>

                        <div class="mb-3">
                            <label for="dueDate" class="form-label">期限（任意）</label>
                            <input id="dueDate" name="dueDate" type="date" class="form-control"
                                   max="9999-12-31" th:value="${dueDate}">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">説明</label>
                            <textarea id="description" name="description" class="form-control" rows="3"
                                      th:text="${description}"></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="status" class="form-label">状態</label>
                            <select id="status" name="status" class="form-select">
                                <option th:each="option : ${statusOptions}" th:value="${option.name()}"
                                        th:selected="${option.name() == status}" th:text="${option.label}">未着手</option>
                            </select>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <a class="btn btn-outline-secondary quest-button" th:href="@{/todo}">戻る</a>
                            <button type="submit" class="btn btn-primary quest-button">確認画面へ</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
