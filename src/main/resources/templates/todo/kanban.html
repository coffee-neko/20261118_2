<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>年調クエスト | カンバン</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <style>
        .kanban-board {
            --kanban-column-bg: #edf1f6;
            --kanban-card-bg: #fff;
            --kanban-accent-idle: #65748b;
            --kanban-accent-active: #315fad;
            --kanban-accent-done: #23764f;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            align-items: start;
            gap: 1rem;
        }
        .kanban-column {
            --kanban-accent: var(--kanban-accent-idle);
            min-height: 12rem;
            padding: .8rem;
            border: 1px solid var(--bs-border-color);
            border-block-start: .25rem solid var(--kanban-accent);
            border-radius: .65rem;
            background: var(--kanban-column-bg);
        }
        .kanban-column[data-kanban-status="IN_PROGRESS"] { --kanban-accent: var(--kanban-accent-active); }
        .kanban-column[data-kanban-status="COMPLETED"] { --kanban-accent: var(--kanban-accent-done); }
        .kanban-column.is-drop-target { outline: 2px solid var(--kanban-accent); outline-offset: -2px; }
        .kanban-card { background: var(--kanban-card-bg); }
        .kanban-card[draggable="true"] { cursor: grab; }
        .kanban-card.is-dragging { opacity: .5; }
        .kanban-card h3,
        .kanban-parent-title,
        .kanban-details dd { overflow-wrap: anywhere; }
        .kanban-card[data-kanban-role="parent"] { border-inline-start: .2rem solid var(--kanban-accent); }
        .kanban-card[data-kanban-role="child"] { margin-inline-start: .5rem; }
        .kanban-details {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            gap: .15rem .65rem;
        }
        .kanban-details dt { font-weight: 500; }
        .kanban-details dd { margin: 0; }
        .kanban-progress { height: .35rem; }
        .kanban-progress .progress-bar { background: var(--kanban-accent); }
        .kanban-move .form-select { width: auto; }
        @media (max-width: 767.98px) {
            .kanban-board { grid-template-columns: minmax(0, 1fr); }
        }
    </style>
</head>
<body class="bg-light">
<main class="container py-4 py-md-5">
    <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <h1 class="h2 mb-0">年調クエスト <span class="text-body-secondary">カンバン</span></h1>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-primary" th:href="@{/todo}">一覧へ</a>
            <a class="btn btn-primary" th:href="@{/todo/new}">新規登録</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-secondary">冒険を終了する</button>
            </form>
        </div>
    </header>
    <p class="text-body-secondary small mb-3">カードを別の列へドラッグするか、カードの「移動」で状態を変更できます。</p>
    <div id="kanban-error" class="alert alert-danger" role="alert" hidden></div>
    <p id="kanban-message" class="text-body-secondary small mb-0" role="status"></p>

    <div id="kanban-board" class="kanban-board" aria-busy="false">
        <section th:each="status : ${statusOptions}" th:with="cards=${todosByStatus.get(status)}"
                 class="kanban-column" th:attr="data-kanban-status=${status.name()},aria-label=${status.label}">
            <header class="d-flex align-items-center justify-content-between gap-2 mb-3">
                <h2 class="h5 mb-0" th:text="${status.label}">未着手</h2>
                <span class="badge text-bg-light" th:text="|${#lists.size(cards)}件|">0件</span>
            </header>
            <p th:if="${#lists.isEmpty(cards)}" class="small text-body-secondary mb-0">タスクなし</p>

            <article th:each="todo : ${cards}"
                     th:with="isChild=${todo.parentId != null},isParent=${todo.childCount > 0}"
                     class="card kanban-card shadow-sm mb-2" draggable="true"
                     th:attr="data-status-url=@{/api/todo/{id}/status(id=${todo.id})},data-kanban-role=${isChild ? 'child' : (isParent ? 'parent' : 'independent')}">
                <div class="card-body p-3">
                    <div class="d-flex flex-wrap gap-1 mb-2">
                        <span class="badge text-bg-light"
                              th:text="${isChild ? '中作業' : (isParent ? '大作業' : '独立タスク')}">独立タスク</span>
                        <span class="badge"
                              th:classappend="${todo.status.completed ? 'text-bg-success' : (todo.status.name() == 'IN_PROGRESS' ? 'text-bg-primary' : 'text-bg-secondary')}"
                              th:text="${todo.status.label}">未着手</span>
                        <span class="badge text-bg-danger"
                              th:if="${!todo.status.completed and todo.dueDate != null and todo.dueDate.isBefore(today)}">期限超過</span>
                    </div>
                    <h3 class="h6 mb-2" th:text="${todo.title}">タスク名</h3>
                    <p th:if="${isChild}" class="kanban-parent-title small text-body-secondary mb-2"
                       th:text="|親タスク ${todo.parentTitle}|">親タスク</p>
                    <dl class="kanban-details small mb-2">
                        <dt class="text-body-secondary">カテゴリ</dt>
                        <dd th:text="${todo.categoryName != null ? todo.categoryName : '未設定'}">未設定</dd>
                        <dt class="text-body-secondary">担当者</dt>
                        <dd th:text="${todo.assigneeName != null ? todo.assigneeName : '未設定'}">未設定</dd>
                        <dt class="text-body-secondary">開始日</dt>
                        <dd th:text="${todo.startDate != null ? todo.startDate : '未設定'}">未設定</dd>
                        <dt class="text-body-secondary">期限</dt>
                        <dd th:text="${todo.dueDate != null ? todo.dueDate : '未設定'}">未設定</dd>
                    </dl>
                    <div th:if="${isParent}" class="mb-3">
                        <div class="d-flex flex-wrap justify-content-between small gap-1 mb-1">
                            <span th:text="|子タスク完了 ${todo.completedChildCount}/${todo.childCount}件|">子タスク完了 1/2件</span>
                            <span th:text="|${todo.childCompletionRate}%|">50%</span>
                        </div>
                        <div class="progress kanban-progress" role="progressbar" aria-label="子タスク達成率"
                             aria-valuemin="0" aria-valuemax="100" th:attr="aria-valuenow=${todo.childCompletionRate}">
                            <div class="progress-bar" th:style="|width: ${todo.childCompletionRate}%;|"></div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center flex-wrap gap-2">
                        <form class="kanban-move d-flex align-items-center gap-1">
                            <select name="status" class="form-select form-select-sm"
                                    th:aria-label="|${todo.title}の移動先|">
                                <option th:each="option : ${statusOptions}" th:value="${option.name()}"
                                        th:selected="${option == status}" th:text="${option.label}">未着手</option>
                            </select>
                            <button type="submit" class="btn btn-outline-secondary btn-sm">移動</button>
                        </form>
                        <a class="btn btn-outline-primary btn-sm" draggable="false"
                           th:href="@{/todo/{id}/edit(id=${todo.id})}">編集</a>
                    </div>
                </div>
            </article>
        </section>
    </div>
</main>
<script>
    const board = document.getElementById('kanban-board');
    const columns = Array.from(board.querySelectorAll('[data-kanban-status]'));
    const errorBanner = document.getElementById('kanban-error');
    const message = document.getElementById('kanban-message');
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
    const errorMessages = {
        400: '変更先の状態が正しくありません。',
        401: 'ログインし直してから、もう一度お試しください。',
        403: '状態を変更できませんでした。ページを再読み込みしてください。',
        404: 'タスクが見つかりません。ページを再読み込みしてください。'
    };
    let draggedCard = null;
    let isSaving = false;

    function clearDropTargets() {
        columns.forEach((column) => column.classList.remove('is-drop-target'));
    }

    function showError(text) {
        errorBanner.textContent = text;
        errorBanner.hidden = false;
    }

    async function moveCard(card, status) {
        const sourceStatus = card.closest('[data-kanban-status]').dataset.kanbanStatus;
        const select = card.querySelector('select[name="status"]');
        if (isSaving || sourceStatus === status) {
            select.value = sourceStatus;
            return;
        }
        if (!csrfToken || !csrfHeader) {
            select.value = sourceStatus;
            showError('状態を保存できません。ページを再読み込みしてください。');
            return;
        }

        isSaving = true;
        board.setAttribute('aria-busy', 'true');
        errorBanner.hidden = true;
        message.textContent = '状態を保存しています…';
        try {
            const response = await fetch(card.dataset.statusUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify({ status })
            });
            if (response.status === 204) {
                window.location.reload();
                return;
            }
            showError(errorMessages[response.status] ?? '状態を保存できませんでした。もう一度お試しください。');
        } catch (error) {
            showError('保存結果を確認できませんでした。ページを再読み込みして現在の状態を確認してください。');
        }
        select.value = sourceStatus;
        isSaving = false;
        board.setAttribute('aria-busy', 'false');
        message.textContent = '';
    }

    board.querySelectorAll('.kanban-card').forEach((card) => {
        card.addEventListener('dragstart', (event) => {
            if (isSaving) {
                event.preventDefault();
                return;
            }
            draggedCard = card;
            card.classList.add('is-dragging');
            event.dataTransfer.setData('text/plain', card.dataset.statusUrl);
            event.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend', () => {
            draggedCard = null;
            card.classList.remove('is-dragging');
            clearDropTargets();
        });
        card.querySelector('.kanban-move').addEventListener('submit', (event) => {
            event.preventDefault();
            moveCard(card, event.currentTarget.elements.namedItem('status').value);
        });
    });

    function canDropOn(column) {
        return !isSaving && draggedCard && !column.contains(draggedCard);
    }

    columns.forEach((column) => {
        column.addEventListener('dragover', (event) => {
            if (!canDropOn(column)) {
                return;
            }
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            clearDropTargets();
            column.classList.add('is-drop-target');
        });
        column.addEventListener('dragleave', (event) => {
            if (!(event.relatedTarget instanceof Node) || !column.contains(event.relatedTarget)) {
                column.classList.remove('is-drop-target');
            }
        });
        column.addEventListener('drop', (event) => {
            if (!canDropOn(column)) {
                return;
            }
            event.preventDefault();
            clearDropTargets();
            moveCard(draggedCard, column.dataset.kanbanStatus);
        });
    });
</script>
</body>
</html>
