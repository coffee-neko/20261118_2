<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>ToDo 一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <style>
        .todo-row[draggable="true"] { cursor: grab; }
        .todo-row.is-dragging { opacity: 0.45; }
        .todo-row.is-drop-before { box-shadow: inset 0 3px 0 var(--bs-primary); }
        .todo-row.is-drop-after { box-shadow: inset 0 -3px 0 var(--bs-primary); }
        #todo-list.is-saving { pointer-events: none; opacity: 0.7; }
    </style>
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 mb-0">ToDo 一覧</h1>
        <a class="btn btn-primary" th:href="@{/todo/new}">新規登録</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-secondary">冒険を終了する</button>
        </form>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show js-auto-dismiss" role="alert">
        <span th:text="${successMessage}">ToDoを削除しました</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="閉じる"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show js-auto-dismiss" role="alert">
        <span th:text="${errorMessage}">削除に失敗しました</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="閉じる"></button>
    </div>

    <form class="card card-body shadow-sm mb-4" th:action="@{/todo}" method="get">
        <div class="row g-2 align-items-end">
            <div class="col-md">
                <label for="keyword" class="form-label">タスク名で検索</label>
                <input id="keyword" name="keyword" type="search" class="form-control"
                       th:value="${keyword}" placeholder="キーワードを入力">
            </div>
            <div class="col-md-3">
                <label for="status" class="form-label">状態で絞り込み</label>
                <select id="status" name="status" class="form-select">
                    <option value="all" th:selected="${status == 'all'}">すべて</option>
                    <option value="incomplete" th:selected="${status == 'incomplete'}">未完了</option>
                    <option value="completed" th:selected="${status == 'completed'}">完了</option>
                </select>
            </div>
            <div class="col-md-auto d-flex gap-2">
                <button type="submit" class="btn btn-primary">検索</button>
                <a class="btn btn-outline-secondary" th:href="@{/todo}">条件をクリア</a>
            </div>
        </div>
    </form>

    <p class="text-muted mb-3" th:text="|全${totalCount}件中 ${startItem}～${endItem}件|">
        全0件中 0～0件
    </p>

    <p th:if="${!hasSearchCondition and not #lists.isEmpty(todos)}" class="text-muted small">
        行をドラッグ＆ドロップして、このページ内の表示順を変更できます。
    </p>
    <p th:if="${hasSearchCondition}" class="text-muted small">
        検索または絞り込み中は、並び替えできません。
    </p>
    <div id="reorder-message" class="small mb-2" role="status" aria-live="polite"></div>

    <div class="card shadow-sm" th:if="${not #lists.isEmpty(todos)}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">タイトル</th>
                    <th scope="col">状態</th>
                    <th scope="col">操作</th>
                </tr>
                </thead>
                <tbody id="todo-list" th:attr="data-page=${currentPage},data-reorder-enabled=${!hasSearchCondition}">
                <tr th:each="todo : ${todos}" class="todo-row" th:attr="data-todo-id=${todo.id}"
                    th:draggable="${!hasSearchCondition}">
                    <td th:text="${todo.id}">1</td>
                    <td th:class="${todo.completed} ? 'text-decoration-line-through text-muted' : ''"
                        th:text="${todo.title}">ToDo の内容</td>
                    <td>
                        <span class="badge"
                              th:classappend="${todo.completed} ? ' text-bg-success' : ' text-bg-secondary'"
                              th:text="${todo.completed} ? '完了' : '未完了'">未完了</span>
                    </td>
                    <td>
                        <form th:action="@{/todo/{id}/toggle(id=${todo.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-outline-success btn-sm">完了切替</button>
                        </form>
                        <a class="btn btn-outline-primary btn-sm me-2"
                           th:href="@{/todo/{id}/edit(id=${todo.id})}">編集</a>
                        <form th:action="@{/todo/{id}/delete(id=${todo.id})}" method="post"
                              class="d-inline" onsubmit="return confirm('本当に削除しますか？');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-danger btn-sm">削除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-4" th:if="${totalPages > 1}" aria-label="ToDo一覧のページ移動">
        <ul class="pagination justify-content-center mb-0">
            <li class="page-item" th:classappend="${currentPage == 1} ? ' disabled'">
                <a class="page-link" th:if="${currentPage > 1}"
                   th:href="@{/todo(page=${currentPage - 1}, keyword=${keyword}, status=${status})}">前へ</a>
                <span class="page-link" th:unless="${currentPage > 1}">前へ</span>
            </li>
            <li class="page-item" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${pageNumber == currentPage} ? ' active'">
                <a class="page-link" th:href="@{/todo(page=${pageNumber}, keyword=${keyword}, status=${status})}"
                   th:text="${pageNumber}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? ' disabled'">
                <a class="page-link" th:if="${currentPage < totalPages}"
                   th:href="@{/todo(page=${currentPage + 1}, keyword=${keyword}, status=${status})}">次へ</a>
                <span class="page-link" th:unless="${currentPage < totalPages}">次へ</span>
            </li>
        </ul>
    </nav>

    <section class="card border-0 shadow-sm text-center" th:if="${#lists.isEmpty(todos) and !hasSearchCondition}">
        <div class="card-body p-5">
            <div class="display-5 text-primary mb-3" aria-hidden="true">✓</div>
            <h2 class="h4">ToDoがまだ登録されていません</h2>
            <p class="text-muted mb-4">最初のToDoを作成して、やることを管理しましょう。</p>
            <a class="btn btn-primary" th:href="@{/todo/new}">新規作成</a>
        </div>
    </section>

    <section class="card border-0 shadow-sm text-center" th:if="${#lists.isEmpty(todos) and hasSearchCondition}">
        <div class="card-body p-5">
            <div class="display-5 text-primary mb-3" aria-hidden="true">⌕</div>
            <h2 class="h4">該当するタスクがありません</h2>
            <p class="text-muted mb-4">別のキーワードで検索するか、検索条件をクリアしてください。</p>
            <a class="btn btn-outline-secondary" th:href="@{/todo}">条件をクリア</a>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script>
    document.querySelectorAll('.js-auto-dismiss').forEach((alertElement) => {
        window.setTimeout(() => {
            bootstrap.Alert.getOrCreateInstance(alertElement).close();
        }, 3000);
    });

    const todoList = document.querySelector('#todo-list[data-reorder-enabled="true"]');
    const reorderMessage = document.getElementById('reorder-message');
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

    if (todoList) {
        let draggingRow;
        let originalOrder = [];
        let isSaving = false;

        const rows = () => Array.from(todoList.querySelectorAll('.todo-row'));
        const clearDropIndicators = () => rows().forEach((row) => {
            row.classList.remove('is-drop-before', 'is-drop-after');
        });

        rows().forEach((row) => {
            row.addEventListener('dragstart', (event) => {
                if (isSaving) {
                    event.preventDefault();
                    return;
                }
                draggingRow = row;
                originalOrder = rows().map((item) => item.dataset.todoId);
                row.classList.add('is-dragging');
                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData('text/plain', row.dataset.todoId);
            });

            row.addEventListener('dragover', (event) => {
                if (!draggingRow || draggingRow === row) {
                    return;
                }
                event.preventDefault();
                clearDropIndicators();
                const insertAfter = event.clientY > row.getBoundingClientRect().top + row.offsetHeight / 2;
                row.classList.add(insertAfter ? 'is-drop-after' : 'is-drop-before');
                event.dataTransfer.dropEffect = 'move';
            });

            row.addEventListener('drop', async (event) => {
                event.preventDefault();
                if (!draggingRow || draggingRow === row || isSaving) {
                    return;
                }

                const insertAfter = event.clientY > row.getBoundingClientRect().top + row.offsetHeight / 2;
                todoList.insertBefore(draggingRow, insertAfter ? row.nextSibling : row);
                clearDropIndicators();
                await saveOrder();
            });

            row.addEventListener('dragend', () => {
                if (draggingRow) {
                    draggingRow.classList.remove('is-dragging');
                }
                clearDropIndicators();
                draggingRow = undefined;
            });
        });

        async function saveOrder() {
            isSaving = true;
            todoList.classList.add('is-saving');
            reorderMessage.textContent = '並び順を保存しています…';
            reorderMessage.className = 'small mb-2 text-muted';

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (csrfToken && csrfHeader) {
                    headers[csrfHeader] = csrfToken;
                }
                const response = await fetch('/api/todo/reorder', {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify({
                        page: Number(todoList.dataset.page),
                        todoIds: rows().map((row) => Number(row.dataset.todoId))
                    })
                });
                if (!response.ok) {
                    throw new Error('保存に失敗しました。');
                }
                reorderMessage.textContent = '並び順を保存しました。';
                reorderMessage.className = 'small mb-2 text-success';
            } catch (error) {
                const rowsById = new Map(rows().map((row) => [row.dataset.todoId, row]));
                originalOrder.forEach((id) => todoList.appendChild(rowsById.get(id)));
                reorderMessage.textContent = '保存に失敗したため、元の並び順に戻しました。';
                reorderMessage.className = 'small mb-2 text-danger';
            } finally {
                isSaving = false;
                todoList.classList.remove('is-saving');
            }
        }
    }
</script>
</body>
</html>
