<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年調クエスト | ガント</title>
    <link th:replace="~{fragments/quest-theme :: stylesheet}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/gantt.css}">
    <script defer th:src="@{/js/gantt.js}"></script>
</head>
<body class="quest-theme gantt-theme">
<main class="gantt-page">
    <header class="gantt-header">
        <h1 class="quest-heading quest-title">年調クエスト <span>ガント</span></h1>
        <nav class="gantt-controls" aria-label="ToDo画面の切り替え">
            <a class="quest-button" th:href="@{/todo}">一覧</a>
            <a class="quest-button" th:href="@{/todo/dashboard}">作戦司令室</a>
            <a class="quest-button" th:href="@{/todo/kanban}">カンバン</a>
            <a class="quest-button" th:href="@{/todo/gantt(month=${month.toString()})}" aria-current="page">ガント</a>
        </nav>
    </header>

    <section class="quest-window gantt-window" aria-labelledby="gantt-month">
        <h2 id="gantt-month" class="quest-heading quest-title" th:text="|${month.getYear()}年${month.getMonthValue()}月|">2026年11月</h2>
        <div class="gantt-controls">
            <nav class="gantt-controls" aria-label="表示月の移動">
                <a class="quest-button" th:if="${previousMonth != null}" th:href="@{/todo/gantt(month=${previousMonth.toString()})}">前月</a>
                <a class="quest-button" th:href="@{/todo/gantt}">今月</a>
                <a class="quest-button" th:if="${nextMonth != null}" th:href="@{/todo/gantt(month=${nextMonth.toString()})}">翌月</a>
            </nav>
            <form class="gantt-controls" method="get" th:action="@{/todo/gantt}">
                <label for="month">表示する年月</label>
                <input id="month" name="month" type="month" min="0001-01" max="9999-12"
                       pattern="[0-9]{4}-[0-9]{2}" placeholder="YYYY-MM" required th:value="${month.toString()}">
                <button class="quest-button" type="submit">表示</button>
            </form>
            <div id="gantt-modes" class="gantt-modes" role="group" aria-label="ガントの表示モード"
                 th:unless="${#lists.isEmpty(todos)}" hidden>
                <button class="quest-button" type="button" data-gantt-mode="month" aria-controls="gantt-scroll" aria-pressed="true">月全体</button>
                <button class="quest-button" type="button" data-gantt-mode="detail" aria-controls="gantt-scroll" aria-pressed="false">詳細</button>
            </div>
        </div>
        <p class="gantt-warning" role="alert" th:if="${monthError}" th:text="${monthError}"></p>

        <p th:if="${#lists.isEmpty(todos)}">登録されているタスクはありません。</p>
        <div id="gantt-scroll" class="gantt-scroll" data-mode="month" th:unless="${#lists.isEmpty(todos)}"
             role="region" aria-label="タスクと日付のスクロール領域" tabindex="0">
            <table class="gantt-table" th:style="|--days: ${days.size()};|">
                <thead>
                <tr>
                    <th class="gantt-task" scope="col">タスク</th>
                    <th scope="col">
                        <div class="gantt-day-grid">
                            <time th:each="day : ${days}" th:with="weekday=${day.getDayOfWeek().name()}"
                                  th:datetime="${day.toString()}"
                                  th:attr="aria-current=${day.equals(today) ? 'date' : null},data-weekday=${weekday}"
                                  th:title="${day.toString()}">
                                <span th:text="${day.getDayOfMonth()}">1</span>
                                <span class="gantt-weekend-label" th:if="${weekday == 'SATURDAY' or weekday == 'SUNDAY'}"
                                      th:text="${weekday == 'SATURDAY' ? '土' : '日'}">土</span>
                            </time>
                        </div>
                    </th>
                </tr>
                </thead>
                <tbody id="gantt-tasks">
                <tr th:each="todo : ${todos}"
                    th:with="placement=${placements[todo.id]}, kind=${placement.kind().name()}"
                    th:attr="data-parent-id=${todo.parentId},data-status=${todo.status.name()}">
                    <th class="gantt-task" scope="row">
                        <div class="gantt-task-details">
                            <a class="gantt-title" th:href="@{/todo/{id}/edit(id=${todo.id})}"
                               th:text="|${displayNumbers[todo.id]} ${todo.title}|">1 タスク名</a>
                            <p class="gantt-meta">
                                <span class="gantt-status" th:text="${todo.status.label}">未着手</span>
                                <span th:text="|担当者 ${todo.assigneeName ?: '未設定'}|">担当者 未設定</span>
                            </p>
                            <p class="gantt-meta">
                                <span th:text="|開始日 ${todo.startDate ?: '未設定'}|">開始日 未設定</span>
                                <span th:text="|期限 ${todo.dueDate ?: '未設定'}|">期限 未設定</span>
                            </p>
                            <p class="gantt-meta" th:if="${kind == 'UNSCHEDULED'}">日付未設定</p>
                            <p class="gantt-meta" th:if="${kind == 'OUTSIDE'}">表示期間外</p>
                            <p class="gantt-warning" th:if="${kind == 'INVALID'}">日付不正（開始日が期限より後）</p>
                            <p class="gantt-warning"
                               th:if="${!todo.status.completed and todo.dueDate != null and todo.dueDate.isBefore(today)}">
                                期限超過
                            </p>
                            <div class="gantt-progress" th:if="${todo.childCount > 0}">
                                <span th:text="|子タスク完了 ${todo.completedChildCount}/${todo.childCount}件・${todo.childCompletionRate}%|">
                                    子タスク完了 1/2件・50%
                                </span>
                                <progress max="100" th:value="${todo.childCompletionRate}" aria-label="子タスク達成率"></progress>
                                <button class="quest-button" type="button" th:attr="data-toggle-children=${todo.id}"
                                        aria-expanded="true" aria-label="子タスクを閉じる" hidden>閉じる</button>
                            </div>
                        </div>
                    </th>
                    <td>
                        <div class="gantt-day-grid gantt-track">
                            <span th:if="${kind == 'BAR'}" class="gantt-bar"
                                  th:classappend="${(placement.continuesBefore() ? 'continues-before ' : '') + (placement.continuesAfter() ? 'continues-after' : '')}"
                                  th:style="|grid-column: ${placement.column()} / span ${placement.span()};|"
                                  th:title="|${todo.startDate} ～ ${todo.dueDate}|" aria-hidden="true"></span>
                            <span th:if="${kind == 'START' or kind == 'DUE'}" class="gantt-marker"
                                  th:style="|grid-column: ${placement.column()};|"
                                  th:with="label=${kind == 'START' ? '開始' : '期限'},date=${kind == 'START' ? todo.startDate : todo.dueDate}"
                                  th:title="|${label} ${date}|" role="img" th:attr="aria-label=|${label} ${date}|">
                                <span class="gantt-marker-short" th:text="${kind == 'START' ? '始' : '限'}">始</span>
                                <span class="gantt-marker-full" th:text="${label}">開始</span>
                            </span>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
