<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>総務部の作戦司令室</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <style>
        .command-room { background: #0c1630; color: #fff; }
        .command-panel { background: #142446; border: 1px solid #fff; }
        .command-note { color: #c7d8ef; }
        .command-room .table {
            --bs-table-color: #fff;
            --bs-table-bg: #142446;
            --bs-table-border-color: #8097b8;
        }
        .command-room .table a { color: #b5d8ff; overflow-wrap: anywhere; }
        .command-room .progress { background: #263f64; height: 1rem; }
    </style>
</head>
<body class="command-room">
<main class="container py-5" th:with="summary=${dashboard.summary()}">
    <header class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-4">
        <div>
            <h1 class="h2 mb-2">総務部の作戦司令室</h1>
            <p class="command-note mb-0" th:text="|${dashboard.today()} 現在（日本時間）|">集計日</p>
        </div>
        <a class="btn btn-outline-light" th:href="@{/todo}">ToDo一覧に戻る</a>
    </header>

    <section class="command-panel rounded p-3 p-md-4 mb-4" aria-labelledby="overview-title">
        <h2 id="overview-title" class="h4">全体の進捗</h2>
        <p class="command-note">子タスクと、子を持たないタスクを集計しています。</p>
        <dl class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3 mb-4">
            <div class="col">
                <dt>全タスク件数</dt>
                <dd class="fs-4 mb-0" th:text="|${summary.total()}件|">0件</dd>
            </div>
            <div class="col" th:each="status : ${statusOptions}">
                <dt th:text="${status.label}">未着手</dt>
                <dd class="fs-4 mb-0" th:text="|${summary.count(status)}件|">0件</dd>
            </div>
            <div class="col">
                <dt>期限超過（未完了）</dt>
                <dd class="fs-4 mb-0 text-warning" th:text="|${summary.overdue()}件|">0件</dd>
            </div>
        </dl>
        <div class="d-flex justify-content-between mb-1">
            <span>全体達成率</span>
            <strong th:text="|${summary.percentage()}%|">0%</strong>
        </div>
        <div class="progress" role="progressbar" aria-label="全体達成率" aria-valuemin="0" aria-valuemax="100"
             th:attr="aria-valuenow=${summary.percentage()}">
            <div class="progress-bar bg-info" th:style="|width: ${summary.percentage()}%;|"></div>
        </div>
    </section>

    <section class="command-panel rounded p-3 p-md-4 mb-4" aria-labelledby="upcoming-title">
        <h2 id="upcoming-title" class="h4">期限が近い未完了タスク</h2>
        <p class="command-note mb-3" th:text="|${dashboard.today()} ～ ${dashboard.lastDay()}|">今日から6日後まで</p>
        <p class="mb-0" th:if="${#lists.isEmpty(dashboard.upcoming())}">この期間に期限を迎える未完了タスクはありません。</p>
        <div class="table-responsive" th:unless="${#lists.isEmpty(dashboard.upcoming())}">
            <table class="table align-middle mb-0">
                <thead>
                <tr><th scope="col">期限</th><th scope="col">タスク名</th><th scope="col">状態</th><th scope="col">担当者</th></tr>
                </thead>
                <tbody>
                <tr th:each="todo : ${dashboard.upcoming()}">
                    <td class="text-nowrap" th:text="${todo.dueDate}">期限</td>
                    <th scope="row"><a th:href="@{/todo/{id}(id=${todo.id})}" th:text="${todo.title}">タスク名</a></th>
                    <td class="text-nowrap" th:text="${todo.status.label}">進行中</td>
                    <td th:text="${todo.assigneeName ?: '未設定'}">未設定</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <div class="row g-4">
        <section class="col-12 col-lg-6" aria-labelledby="assignee-title">
            <div class="command-panel rounded p-3 p-md-4 h-100">
                <h2 id="assignee-title" class="h4">担当者別</h2>
                <p class="mb-0" th:if="${#lists.isEmpty(dashboard.byAssignee())}">集計対象のタスクはありません。</p>
                <div class="table-responsive" th:unless="${#lists.isEmpty(dashboard.byAssignee())}">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr><th scope="col">担当者</th><th scope="col" class="text-end">件数</th>
                            <th scope="col" class="text-end">完了件数</th><th scope="col" class="text-end">完了率</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="group : ${dashboard.byAssignee()}">
                            <th scope="row" class="text-break" th:text="${group.name() ?: '担当者未設定'}">担当者</th>
                            <td class="text-end" th:text="${group.total()}">0</td>
                            <td class="text-end" th:text="${group.completed()}">0</td>
                            <td class="text-end" th:text="|${group.percentage()}%|">0%</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
        <section class="col-12 col-lg-6" aria-labelledby="category-title">
            <div class="command-panel rounded p-3 p-md-4 h-100">
                <h2 id="category-title" class="h4">カテゴリ別</h2>
                <p class="mb-0" th:if="${#lists.isEmpty(dashboard.byCategory())}">集計対象のタスクはありません。</p>
                <div class="table-responsive" th:unless="${#lists.isEmpty(dashboard.byCategory())}">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr><th scope="col">カテゴリ</th><th scope="col" class="text-end">件数</th>
                            <th scope="col" class="text-end">完了件数</th><th scope="col" class="text-end">完了率</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="group : ${dashboard.byCategory()}">
                            <th scope="row" class="text-break" th:text="${group.name() ?: 'カテゴリ未設定'}">カテゴリ</th>
                            <td class="text-end" th:text="${group.total()}">0</td>
                            <td class="text-end" th:text="${group.completed()}">0</td>
                            <td class="text-end" th:text="|${group.percentage()}%|">0%</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>
</body>
</html>
